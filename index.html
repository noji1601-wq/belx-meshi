<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ベルクス飯｜戸田店</title>
<style>
body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;background:#f5f6f8;margin:0;color:#222}.wrap{max-width:900px;margin:auto;padding:20px}.hero{background:#111;color:#fff;border-radius:20px;padding:24px;margin-bottom:16px}.hero h1{margin:0 0 6px;font-size:28px}.muted{color:#777}.hero .muted{color:#bbb}.card{background:#fff;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 2px 12px #0000000d}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.recipe h2{font-size:20px;margin:0 0 8px}.tag{display:inline-block;background:#eee;border-radius:999px;padding:4px 9px;font-size:12px;margin:2px}.price{font-size:13px;color:#555}.shopping li{margin:6px 0}.error{background:#fff3f3;border:1px solid #f3cccc}.small{font-size:12px}.btn{display:inline-block;padding:10px 14px;background:#111;color:#fff;border-radius:10px;text-decoration:none;margin-top:8px}
</style></head>
<body><main class="wrap"><section class="hero"><h1>ベルクス飯</h1><div>ベルクス戸田店の今日の特売から、夕飯を3案。</div><div id="date" class="muted"></div></section><div id="app"><div class="card">読み込み中…</div></div></main>
<script>
async function main(){
 const app=document.getElementById('app');
 try{
  const r=await fetch('data.json?'+Date.now()); if(!r.ok) throw new Error('data.json unavailable');
  const d=await r.json(); document.getElementById('date').textContent=`${d.date} 更新｜${d.source||'公式チラシ'}`;
  if(d.error){app.innerHTML=`<div class="card error"><b>今日は自動取得に失敗しました</b><p>${esc(d.error)}</p><p class="small">次回の自動実行で再試行します。</p></div>`;return;}
  let html='';
  html+='<section class="card"><h2>今日の特売</h2><div>'+((d.sale_items||[]).map(x=>`<span class="tag">${esc(x)}</span>`).join('')||'抽出できた商品なし')+'</div></section>';
  html+='<section class="grid">'+(d.recipes||[]).map(x=>`<article class="card recipe"><h2>${esc(x.name)}</h2><div class="price">${esc(x.reason||'特売品を優先')}</div><h3>材料</h3><ul>${(x.ingredients||[]).map(i=>`<li>${esc(i)}</li>`).join('')}</ul><h3>作り方</h3><ol>${(x.steps||[]).map(i=>`<li>${esc(i)}</li>`).join('')}</ol></article>`).join('')+'</section>';
  html+='<section class="card shopping"><h2>まとめ買い</h2><ul>'+((d.shopping||[]).map(x=>`<li>${esc(x)}</li>`).join('')||'<li>特売品を確認してください</li>')+'</ul>'+(d.flyer_url?`<a class="btn" href="${escAttr(d.flyer_url)}" target="_blank" rel="noopener">公式チラシを見る</a>`:'')+'</section>';
  app.innerHTML=html;
 }catch(e){app.innerHTML='<div class="card error">データを読み込めませんでした。少し時間を置いて再読み込みしてください。</div>';}
}
function esc(s){return String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[c]));}
function escAttr(s){return esc(s).replace(/'/g,'&#39;');}
main();
</script></body></html>
