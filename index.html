<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ベルクス飯｜戸田店</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yusei+Magic&family=Klee+One:wght@400;600&display=swap">
<style>
/* 白い紙にペンとマーカーで書いたメモ。見出しはマーカー、本文はペン字 */
:root{
  --paper:#ffffff;--ink:#2b2b2b;--muted:#6b6b6b;--line:#d9d9d9;--red:#e0483e;--marker:#ffe66d;--soft:#f6f6f4;
  --display:"Yusei Magic","Klee One","Hiragino Maru Gothic ProN",sans-serif;
  --body:"Klee One","Hiragino Mincho ProN","Yu Mincho",serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.8;
  padding:max(20px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 48px max(16px,env(safe-area-inset-left))}
.wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:26px}
.store{align-self:flex-start;font-family:var(--display);font-size:14px;color:var(--red);border:2px solid var(--red);padding:1px 10px;border-radius:255px 15px 225px 15px/15px 225px 15px 255px;transform:rotate(-2deg)}
header{display:flex;flex-direction:column;gap:6px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(30px,8.5vw,42px);line-height:1.25;margin:0}
h1 em{font-style:normal;background:linear-gradient(transparent 55%,var(--marker) 55%)}
.date{color:var(--muted);font-size:14px;margin:0}
h2{font-family:var(--display);font-weight:400;font-size:20px;margin:0;border-bottom:2px dashed var(--line);padding-bottom:4px}
section{display:flex;flex-direction:column;gap:12px}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.tag{background:var(--paper);border:1.5px solid var(--ink);border-radius:255px 15px 225px 15px/15px 225px 15px 255px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tag:nth-child(even){transform:rotate(.6deg)}
.tag:nth-child(odd){transform:rotate(-.5deg)}
.tag .nm{font-weight:600;font-size:14px;line-height:1.4}
.tag .pr{font-family:var(--display);color:var(--red);font-size:24px;line-height:1.15;font-variant-numeric:tabular-nums}
.tag .pr small{font-family:var(--body);font-size:12px;font-weight:600;margin-left:2px}
.tag .nt{font-size:12px;color:var(--muted)}
.rc{background:var(--paper);border:2px solid var(--ink);border-radius:15px 225px 15px 255px/255px 15px 225px 15px;padding:18px;display:flex;flex-direction:column;gap:8px}
.rc h3{font-family:var(--display);font-weight:400;font-size:22px;margin:0;line-height:1.35}
.meta{display:flex;gap:8px;flex-wrap:wrap;font-size:13px;font-weight:600}
.meta span{padding:0 8px;border-radius:4px;background:var(--soft)}
.meta .use{background:linear-gradient(transparent 40%,var(--marker) 40%);border-radius:0;padding:0 4px}
.why{margin:0;font-size:14px;color:var(--muted)}
.rc h4{margin:4px 0 0;font-size:14px;font-weight:600}
.rc ul,.rc ol,.shop ul{margin:0;padding-left:1.4em}
.box{background:var(--soft);border:2px dashed var(--line);border-radius:12px;padding:16px}
a.btn{align-self:flex-start;display:inline-block;padding:8px 18px;color:var(--ink);border:2px solid var(--ink);border-radius:255px 15px 225px 15px/15px 225px 15px 255px;text-decoration:none;font-family:var(--display)}
a.btn:focus-visible{outline:3px solid var(--red);outline-offset:2px}
footer{font-size:12px;color:var(--muted)}
body::before,body::after{content:"";position:fixed;width:min(48vw,280px);aspect-ratio:1;background:var(--kin,none) no-repeat center/contain;opacity:.55;pointer-events:none;z-index:0}
body::before{top:0;right:0}
body::after{bottom:0;left:0;transform:rotate(180deg)}
body{background-image:var(--petal,none);background-size:200px}
.wrap{position:relative;z-index:1}
.tag,.rc{background:rgba(255,255,255,.9)}
</style>
</head>
<body>
<main class="wrap">
  <header>
    <span class="store">ベルクス 戸田店</span>
    <h1>今日の<em>特売</em>で<br>夕飯3品</h1>
    <p class="date" id="date">読み込み中…</p>
  </header>
  <div id="app"></div>
  <footer>毎朝7時40分ごろに公式チラシから自動更新。価格・在庫は店頭で確認してください。</footer>
</main>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function main(){
  const app=document.getElementById('app');
  try{
    const r=await fetch('data.json?'+Date.now()); if(!r.ok) throw new Error();
    const d=await r.json();
    document.getElementById('date').textContent=`${d.date} のチラシ（${(d.updated_at||'').slice(11,16)} 更新）`;
    const todayJst=new Date(Date.now()+9*3600e3).toISOString().slice(0,10);
    if(d.date!==todayJst) document.getElementById('date').textContent+=' ※今日の分はまだ反映されていません';
    const flyer=d.source_url?`<a class="btn" href="${esc(d.source_url)}" target="_blank" rel="noopener">公式チラシPDFを見る</a>`:'';
    if(d.status && d.status!=='ok'){
      const msg=d.status==='no_items'?'今日のチラシから特売品を読み取れませんでした。':'特売品は取れましたが、レシピを作れませんでした。';
      app.innerHTML=`<section><div class="box"><b>${msg}</b><br>次回の自動更新で再試行します。</div>${shelf(d.sale_items)}${flyer}</section>`;
      return;
    }
    app.innerHTML=`
      <section><h2>今日の特売</h2>${shelf(d.sale_items)}</section>
      <section><h2>夕飯3品</h2>${(d.recipes||[]).map(card).join('')}</section>
      ${(d.shopping||[]).length?`<section class="shop"><h2>買い足すもの</h2><ul>${d.shopping.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></section>`:''}
      ${flyer}`;
  }catch(e){
    app.innerHTML='<div class="box">データを読み込めませんでした。少し時間をおいて再読み込みしてください。</div>';
  }
}
function shelf(items){
  if(!items||!items.length) return '';
  return '<div class="shelf">'+items.map(i=>{
    const p=i.price!=null&&i.price!==''?`<span class="pr">${esc(i.price)}<small>円</small></span>`:'';
    const sub=[i.unit,i.note].filter(Boolean).join('・');
    return `<div class="tag"><span class="nm">${esc(i.name)}</span>${p}${sub?`<span class="nt">${esc(sub)}</span>`:''}</div>`;
  }).join('')+'</div>';
}
function card(r){
  return `<article class="rc"><h3>${esc(r.name)}</h3>
    <div class="meta">${r.minutes?`<span>約${esc(r.minutes)}分</span>`:''}${(r.uses||[]).map(u=>`<span class="use">特売 ${esc(u)}</span>`).join('')}</div>
    ${r.reason?`<p class="why">${esc(r.reason)}</p>`:''}
    <h4>材料（2人分）</h4><ul>${(r.ingredients||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
    <h4>作り方</h4><ol>${(r.steps||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ol></article>`;
}
// 金木犀の背景イラスト（SVGをその場で描く）
(function(){
  let seed=7;const rnd=()=>((seed=seed*16807%2147483647)/2147483647);
  const D='<defs><g id="f"><g fill="#f5a23c"><ellipse cy="-3.6" rx="2.7" ry="3.8"/><ellipse cx="3.6" rx="3.8" ry="2.7"/><ellipse cy="3.6" rx="2.7" ry="3.8"/><ellipse cx="-3.6" rx="3.8" ry="2.7"/></g><circle r="1.5" fill="#d8711d"/></g><g id="lf"><path d="M0 0C16-9 38-7 54 0C38 7 16 9 0 0Z" fill="#86a874"/><path d="M3 0Q28-1 50 0" stroke="#5f8452" stroke-width="1.1" fill="none"/></g></defs>';
  const use=(id,x,y,a,s)=>`<use href="#${id}" transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${a|0}) scale(${s.toFixed(2)})"/>`;
  const cl=(x,y,n,r)=>Array.from({length:n},()=>use('f',x+(rnd()*2-1)*r,y+(rnd()*2-1)*r,rnd()*90,.75+rnd()*.35)).join('');
  const st='stroke="#8b6b52" fill="none" stroke-linecap="round"';
  const br=`<path d="M262 6C214 30 178 58 146 98S92 178 58 214 18 252 4 258" ${st} stroke-width="3.2"/><path d="M168 76C186 92 196 112 200 134" ${st} stroke-width="2.2"/><path d="M104 152C88 160 74 162 58 160" ${st} stroke-width="2"/>`;
  const lv=[[226,26,200,1],[214,32,140,.9],[178,60,215,.95],[160,84,120,1],[198,128,70,.85],[132,118,210,.9],[116,138,110,.95],[80,186,215,.85],[66,198,120,.9],[60,160,190,.8],[34,232,140,.8]].map(v=>use('lf',...v)).join('');
  const fl=cl(196,46,9,11)+cl(150,98,10,11)+cl(200,146,7,9)+cl(100,162,9,11)+cl(52,222,8,11)+cl(66,170,5,7);
  const corner=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 264 264">${D}${br}${lv}${fl}</svg>`;
  const petal=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">${D}<g opacity=".35">${[[30,40,10,.8],[140,22,40,.6],[96,110,70,.7],[170,150,20,.55],[40,170,55,.65]].map(v=>use('f',...v)).join('')}</g></svg>`;
  const u=svg=>`url("data:image/svg+xml,${encodeURIComponent(svg)}")`;
  document.documentElement.style.setProperty('--kin',u(corner));
  document.documentElement.style.setProperty('--petal',u(petal));
})();
main();
</script>
</body>
</html>
