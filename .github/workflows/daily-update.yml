name: Daily Belx update
on:
  workflow_dispatch:
  schedule:
    - cron: '40 22 * * *'
      timezone: 'Asia/Tokyo'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update data
        run: |
          python - <<'PY'
          import json,datetime
          p='data.json'
          try:
            d=json.load(open(p,encoding='utf-8'))
          except Exception:
            d={}
          d['updated_at']=datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=9))).isoformat(timespec='minutes')
          d.setdefault('date',datetime.date.today().isoformat())
          d.setdefault('source','ベルクス戸田店 公式チラシ')
          json.dump(d,open(p,'w',encoding='utf-8'),ensure_ascii=False,indent=2)
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data.json
          git diff --cached --quiet || git commit -m 'chore: daily update'
          git push
