name: Daily Belx update
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-update.yml'
      - 'scripts/**'
  workflow_dispatch:
  schedule:
    - cron: '40 22 * * *'
      timezone: 'Asia/Tokyo'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install OCR tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-jpn
      - name: Fetch flyer, OCR and build recipes
        run: python scripts/update_belx.py
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data.json
          git diff --cached --quiet || git commit -m 'chore: update Belx flyer and recipes'
          git push
